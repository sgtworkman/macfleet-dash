<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>macfleet-dash — Mac fleet health</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23f0b03a' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><rect x='4' y='4' width='16' height='11' rx='1.5'/><path d='M2 19h20'/></svg>">
<script>
  try {
    var t = localStorage.getItem("macfleet-theme");
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  } catch (e) {}
</script>
<style>
  :root, [data-theme="dark"] {
    --bg:#0a0c0f; --surface:#12151a; --elevated:#181c22; --hover:#1f242b;
    --border:#232830; --border-strong:#343b46; --text:#e9ecf0; --text-strong:#fff;
    --muted:#8a919c; --faint:#5b626d; --accent:#f0b03a; --accent-soft:#f0b03a24;
    --good:#3fd08f; --bad:#ff5d62; --warn:#ff914d; --info:#6ea8ff; --violet:#b690ff;
    --shadow:0 1px 2px #0006, 0 0 0 1px var(--border);
    --shadow-hover:0 8px 24px #00000080, 0 0 0 1px var(--border-strong);
  }
  [data-theme="light"] {
    --bg:#dce0e7; --surface:#fff; --elevated:#eceff4; --hover:#dde1e8;
    --border:#cfd5de; --border-strong:#b9c1ce; --text:#12161c; --text-strong:#000;
    --muted:#5a6370; --faint:#8b93a0; --accent:#e8a21c; --accent-soft:#e8a21c29;
    --good:#12915f; --bad:#cf3038; --warn:#c85a10; --info:#2a6fdb; --violet:#7a4fd8;
    --shadow:0 1px 2px #141e320d, 0 0 0 1px var(--border);
    --shadow-hover:0 6px 20px #141e321a, 0 0 0 1px var(--border-strong);
  }
  * { box-sizing: border-box; }
  body { margin:0; padding:20px 18px 48px; background:var(--bg); color:var(--text);
    font:14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header { display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:18px; }
  header h1 { font-size:20px; margin:0; display:flex; align-items:center; gap:8px; color:var(--text-strong); }
  .head-stats { display:flex; gap:18px; flex-wrap:wrap; margin-left:auto; align-items:center; }
  .head-stat { text-align:right; }
  .head-stat b { display:block; font-size:15px; color:var(--text-strong); font-variant-numeric:tabular-nums; }
  .head-stat span { font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
  .theme-btn { background:var(--surface); color:var(--muted); border:1px solid var(--border);
    border-radius:8px; padding:6px 10px; cursor:pointer; font-size:12px; }
  .theme-btn:hover { color:var(--text); border-color:var(--border-strong); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(330px, 1fr)); gap:14px; }
  .card { background:var(--surface); border-radius:12px; box-shadow:var(--shadow);
    padding:16px 16px 14px; cursor:pointer; transition:box-shadow .15s; }
  .card:hover { box-shadow:var(--shadow-hover); }
  .card.open { background:var(--elevated); box-shadow:var(--shadow-hover); }
  .card-head { display:flex; align-items:baseline; gap:8px; margin-bottom:4px; flex-wrap:wrap; }
  .card-head h2 { font-size:15px; margin:0; color:var(--text-strong); }
  .role { font-size:11px; color:var(--muted); margin-bottom:10px; min-height:13px; }
  .chip { font-size:10.5px; padding:2px 8px; border-radius:99px; margin-left:auto; white-space:nowrap;
    border:1px solid var(--border-strong); color:var(--muted); }
  .chip.good { color:var(--good); border-color:var(--good); }
  .chip.bad { color:var(--bad); border-color:var(--bad); }
  .chip.accent { color:var(--accent); border-color:var(--accent); background:var(--accent-soft); }
  .metrics { display:grid; grid-template-columns:1fr 1fr; gap:8px 14px; margin-top:8px; }
  .metric .lab { font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
  .metric .val { font-size:13px; color:var(--text-strong); font-variant-numeric:tabular-nums; }
  .bar { height:5px; border-radius:3px; background:var(--hover); margin-top:4px; overflow:hidden; }
  .bar i { display:block; height:100%; border-radius:3px; background:var(--accent); transition:width .4s; }
  .bar i.v { background:var(--violet); } .bar i.w { background:var(--warn); } .bar i.r { background:var(--bad); }
  .spark-row { display:flex; gap:14px; margin-top:10px; }
  .spark-box { flex:1; min-width:0; }
  .spark-box .lab { font-size:10.5px; color:var(--muted); margin-bottom:2px; }
  .spark-box svg { width:100%; height:30px; display:block; }
  .extra { margin-top:10px; padding-top:10px; border-top:1px dashed var(--border);
    display:grid; grid-template-columns:1fr 1fr; gap:8px 14px; }
  .err { margin-top:8px; font-size:11.5px; color:var(--bad); }
  footer { margin-top:22px; font-size:11px; color:var(--faint); }
  .updated { font-size:11px; color:var(--muted); text-transform:none !important; letter-spacing:0 !important; }
  @media (max-width: 480px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#f0b03a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="11" rx="1.5"/><path d="M2 19h20"/></svg>macfleet-dash</h1>
  <div class="head-stats">
    <div class="head-stat"><b id="s-online">—</b><span>online</span></div>
    <div class="head-stat"><b id="s-mem">—</b><span>memory in use</span></div>
    <div class="head-stat"><b id="s-cpu">—</b><span>busiest cpu</span></div>
    <div class="head-stat"><b id="s-disk">—</b><span>disk free</span></div>
    <div class="head-stat updated" id="s-updated">…</div>
    <button class="theme-btn" id="themeBtn" title="Toggle theme">◐ theme</button>
  </div>
</header>
<div class="grid" id="grid"></div>
<footer>Read-only probes (ssh/local/http · no sudo · no secrets) · power/thermal only where the owner approved the sampler · tailnet presence read locally · <span id="ver"></span></footer>

<script>
"use strict";
let DATA = null, OPEN = null;
const $ = (id) => document.getElementById(id);
const fmt = (v, s = "") => v == null ? "—" : v + s;
const pct = (v) => v == null ? "—" : Math.round(v) + "%";
const barCls = (v) => v == null ? "" : v > 90 ? "r" : v > 70 ? "w" : "";

function polyline(series, index, W = 200, H = 30) {
  const pts = (series || []).map(p => Array.isArray(p) ? p[index] : null);
  const idxs = pts.map((v, i) => [i, v]).filter(([, v]) => typeof v === "number" && isFinite(v));
  if (idxs.length < 2) return null;
  const vals = idxs.map(([, v]) => v);
  const min = Math.min(...vals), max = Math.max(...vals), span = (max - min) || 1;
  return idxs.map(([i, v]) => {
    const x = 2 + (i / (pts.length - 1)) * (W - 4);
    const y = H - 3 - ((v - min) / span) * (H - 6);
    return x.toFixed(1) + "," + y.toFixed(1);
  }).join(" ");
}
function spark(series, index, color) {
  const pts = polyline(series, index);
  if (!pts) return "<svg></svg>";
  return '<svg viewBox="0 0 200 30" preserveAspectRatio="none"><polyline points="' + pts +
    '" fill="none" stroke="' + color + '" stroke-width="1.6"/></svg>';
}
function metric(lab, val, barVal, cls) {
  return '<div class="metric"><div class="lab">' + lab + '</div><div class="val">' + val + '</div>' +
    (barVal != null ? '<div class="bar"><i class="' + (cls || "") + '" style="width:' +
      Math.min(100, Math.max(0, barVal)) + '%"></i></div>' : "") + "</div>";
}

function hostCard(row, historyHosts) {
  const open = OPEN === row.host;
  const ok = row.status === "available";
  const series = (historyHosts && historyHosts[row.host]) || [];
  const serving = row.serving && row.serving.model
    ? '<span class="chip accent" title="OpenAI-compatible model serving">⚡ ' + row.serving.model + "</span>" : "";
  const tail = row.tailnet
    ? (row.tailnet.online ? '<span class="chip good">tailnet</span>'
       : '<span class="chip bad" title="' + (row.tailnet.lastSeen || "") + '">offline' +
         (row.tailnet.lastSeen ? " · " + row.tailnet.lastSeen : "") + "</span>")
    : "";
  const pw = row.power;
  const powerLine = pw
    ? fmt(pw.cpuW, " W") + " CPU · " + fmt(pw.gpuW, " W") + " GPU · " + fmt(pw.dieTempC, "°C") + " die"
    : "no power sampler";
  let body;
  if (!ok) {
    body = '<div class="err">No answer — ' + (row.refreshFailure || "probe failed") +
      (row.tailnet && row.tailnet.lastSeen ? " · tailnet last seen " + row.tailnet.lastSeen : "") + "</div>";
  } else {
    const memPct = row.memUsedGb != null && row.ramGb ? (row.memUsedGb / row.ramGb) * 100 : null;
    const swapPct = row.swapUsedGb != null && row.ramGb ? Math.min(100, (row.swapUsedGb / row.ramGb) * 100) : null;
    body = '<div class="metrics">' +
      metric("CPU", pct(row.cpuUsedPct), row.cpuUsedPct, barCls(row.cpuUsedPct)) +
      metric("GPU", pct(row.gpuUtilPct), row.gpuUtilPct, "v") +
      metric("Memory", fmt(row.memUsedGb) + " / " + fmt(row.ramGb, " GB"), memPct, barCls(memPct)) +
      metric("Swap", row.swapUsedGb != null ? fmt(row.swapUsedGb, " GB") : "—", swapPct, "w") +
      metric("Disk free", row.diskFreeGb != null ? fmt(row.diskFreeGb, " GB") : "—", null) +
      metric("Network", row.netRxMbps != null ? "↓ " + row.netRxMbps + " · ↑ " + row.netTxMbps + " MB/s" : "—", null) +
      metric("Load", fmt(row.load1m) + " / " + fmt(row.load5m), null) +
      metric("Uptime", row.uptimeDays != null ? fmt(Math.round(row.uptimeDays * 10) / 10, " d") : "—", null) +
      "</div>";
    if (open) {
      body += '<div class="spark-row">' +
        '<div class="spark-box"><div class="lab">CPU · 24h</div>' + spark(series, 1, "var(--accent)") + "</div>" +
        '<div class="spark-box"><div class="lab">GPU · 24h</div>' + spark(series, 2, "var(--info)") + "</div>" +
        '<div class="spark-box"><div class="lab">Memory · 24h</div>' + spark(series, 3, "var(--violet)") + "</div></div>" +
        '<div class="extra">' +
        metric("Chip", [row.chip, row.arch].filter(Boolean).join(" · ") || "—") +
        metric("OS", row.os || "—") +
        metric("Power & thermal", powerLine) +
        metric("Disk", row.diskUsedGb != null ? row.diskUsedGb + " used / " + row.diskTotalGb + " total GB" : "—") +
        metric("Hostname", row.hostname || "—") +
        metric("Cumulative net", row.netRxMb != null ? row.netRxMb + " ↓ / " + row.netTxMb + " ↑ MB" : "—") +
        "</div>";
    } else {
      body += '<div class="spark-row"><div class="spark-box"><div class="lab">CPU · 24h</div>' +
        spark(series, 1, "var(--accent)") + "</div></div>";
    }
    if (row.refreshFailure) body += '<div class="err">' + row.refreshFailure + "</div>";
  }
  return '<div class="card ' + (open ? "open" : "") + '" data-host="' + row.host + '">' +
    '<div class="card-head"><h2>' + (row.name || row.host) + "</h2>" +
    '<span class="chip ' + (ok ? "good" : "bad") + '">' + (ok ? "Online" : "No answer") + "</span>" +
    serving + tail + '</div><div class="role">' + (row.role || row.note || "") + "</div>" + body + "</div>";
}

function render() {
  if (!DATA) return;
  const hosts = DATA.hosts || [], history = (DATA.history && DATA.history.hosts) || {};
  const online = hosts.filter(r => r.status === "available");
  $("s-online").textContent = (DATA.onlineCount ?? 0) + "/" + (DATA.totalCount ?? 0);
  const memUsed = online.reduce((s, r) => s + (r.memUsedGb ?? 0), 0);
  const memCap = online.reduce((s, r) => s + (r.ramGb ?? 0), 0);
  $("s-mem").textContent = memCap ? Math.round(memUsed) + " / " + Math.round(memCap) + " GB" : "—";
  const busiest = [...online].filter(r => r.cpuUsedPct != null).sort((a, b) => b.cpuUsedPct - a.cpuUsedPct)[0];
  $("s-cpu").textContent = busiest ? busiest.name + " " + Math.round(busiest.cpuUsedPct) + "%" : "—";
  $("s-disk").textContent = online.reduce((s, r) => s + (r.diskFreeGb ?? 0), 0).toFixed(0) + " GB";
  $("s-updated").textContent = DATA.observedAt ? "polled " + new Date(DATA.observedAt).toLocaleTimeString() : "";
  $("ver").textContent = "macfleet-dash v" + (DATA.version || "?");
  $("grid").innerHTML = hosts.map(r => hostCard(r, history)).join("");
  document.querySelectorAll(".card").forEach(el =>
    el.addEventListener("click", () => { OPEN = OPEN === el.dataset.host ? null : el.dataset.host; render(); }));
}

async function load() {
  try {
    const r = await fetch("data.json", { cache: "no-store" });
    if (r.ok) { DATA = await r.json(); render(); }
  } catch (e) { /* keep the last good data on screen */ }
}
$("themeBtn").addEventListener("click", () => {
  const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  try { localStorage.setItem("macfleet-theme", next); } catch (e) {}
});
load();
setInterval(load, 60000);
</script>
</body>
</html>
