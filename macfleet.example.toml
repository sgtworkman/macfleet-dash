# Example macfleet.toml — copy to macfleet-dash root (next to collector/) and edit.
# method: "ssh" (BatchMode, no sudo) | "local" (this machine) | "http" (metrics endpoint)

interval = 300

[hosts.mini1]
method = "ssh"
host = "you@mini1"
role = "Services · sparkDash host"

[hosts.mini2]
method = "ssh"
host = "you@mini2"
role = "Services · Blog Factory + automation"

[hosts.localhost]
method = "local"
role = "Hermes executive cockpit"

[hosts.macstudio]
method = "http"
url = "http://100.64.0.5:8791/metrics.txt"
role = "Local AI · vision and text"  # saved role, not a live model name
# The snapshot publisher checks this explicit private llama.cpp endpoint.
# model_url = "http://100.64.0.5:8000/v1/models"
# ts_ip = "100.64.0.5"  # if set, model endpoint IP must match
# Keep metadata monitoring independent of an optional generation benchmark.
# bench = false
# bench = true adds a small generation-rate probe (one ~96-token completion per
# cycle) and shows end-to-end tok/s on the serving chip. Opt-in per host.

[hosts.mbp2013]
method = "ssh"
host = "mbp2013"
role = "Amazon lane (Omarchy)"

# Optional: use your existing private SparkDash. Nothing is contacted by default.
# [sparkdash]
# enabled = true
# url = "https://your-dashboard.your-tailnet.ts.net"
# [sparkdash.units.your-unit-id]
# name = "My AI machine"
# host = "your-existing-macfleet-host"  # optional; requires exact ts_ip match
