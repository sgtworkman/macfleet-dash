name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    if: ${{ (github.event_name != 'pull_request' && github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.full_name == github.repository) && (github.event_name != 'workflow_run' || github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ["self-hosted","Linux","ARM64","workman-ci"]
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Selftest
        run: python collector/macfleet.py --selftest
      - name: Public source archive privacy
        run: |
          release_version=$(sed -n 's/^## \[\([0-9.]*\)\].*/\1/p' CHANGELOG.md | head -n 1)
          git archive --format=tar.gz --prefix="macfleet-dash-v${release_version}/" HEAD --output="$RUNNER_TEMP/macfleet-source.tar.gz"
          python collector/check_release.py "$RUNNER_TEMP/macfleet-source.tar.gz"

  secrets:
    if: ${{ (github.event_name != 'pull_request' && github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.full_name == github.repository) && (github.event_name != 'workflow_run' || github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ["self-hosted","Linux","ARM64","workman-ci"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Scan full history with verified Gitleaks CLI
        run: python .github/scripts/scan-secrets.py
      - name: Retain redacted secret-scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: results.sarif
          if-no-files-found: error

  viewer:
    if: ${{ (github.event_name != 'pull_request' && github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.full_name == github.repository) && (github.event_name != 'workflow_run' || github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ["self-hosted","Linux","ARM64","workman-ci"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Viewer and release tests
        run: node --test tests/*.test.mjs
      - name: Viewer syntax
        run: node --check viewer/fleet-app.mjs
